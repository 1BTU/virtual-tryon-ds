name: Inference regression tests

on:
  push:
    branches: [master, 'optimize/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install CPU inference dependencies
        run: >-
          python -m pip install
          'torch==1.9.0+cpu' 'torchvision==0.10.0+cpu'
          'numpy<1.24' 'Pillow<10' 'tqdm<5'
          -f https://download.pytorch.org/whl/torch_stable.html
      - name: Run inference regression tests
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -v
